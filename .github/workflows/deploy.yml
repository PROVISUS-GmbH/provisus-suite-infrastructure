name: Deploy Azure Bicep

"on":
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      action: ${{ steps.detect.outputs.action }}

    steps:
      - name: Detect environment and action from tag
        id: detect
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          echo "Tag ricevuto: $TAG"

          if [[ "$TAG" == *"-prod-"* ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"-qa-"* ]]; then
            echo "environment=qa" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"-dev-"* ]]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          else
            echo "Errore: il tag deve contenere -dev-, -qa- oppure -prod-"
            echo "Esempi validi: v0.2.0-dev-create, v0.2.0-dev-what"
            exit 1
          fi

          if [[ "$TAG" == *"-create" ]]; then
            echo "action=create" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"-what" ]]; then
            echo "action=what" >> "$GITHUB_OUTPUT"
          else
            echo "Errore: il tag deve finire con -create oppure -what"
            echo "Esempi validi: v0.2.0-dev-create, v0.2.0-dev-what"
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: prepare

    # Il subject OIDC usato da Azure segue l'ambiente rilevato dal tag (dev/qa/prod).
    environment:
      name: ${{ needs.prepare.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show deploy info
        shell: bash
        run: |
          echo "Pipeline partita correttamente"
          echo "Ambiente Bicep: ${{ needs.prepare.outputs.environment }}"
          echo "GitHub Environment: ${{ needs.prepare.outputs.environment }}"
          echo "Azione: ${{ needs.prepare.outputs.action }}"
          echo "Tag: $GITHUB_REF_NAME"
          echo "Resource Group: ${{ vars.AZURE_RESOURCE_GROUP }}"
          echo "Deployment Name: ${{ vars.DEPLOYMENT_NAME }}"
          echo "Env Code: ${{ vars.ENV_CODE }}"
          echo "Client Name: ${{ vars.CLIENT_NAME }}"
          echo "Key Vault Name: ${{ vars.KEY_VAULT_NAME }}"
          echo "App Config Name: ${{ vars.APP_CONFIG_NAME }}"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-If Deployment
        if: ${{ needs.prepare.outputs.action == 'what' }}
        shell: bash
        run: |
          az deployment group what-if \
            --name "${{ vars.DEPLOYMENT_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file bicep/main.bicep \
            --parameters envCode="${{ vars.ENV_CODE }}" \
            --parameters clientName="${{ vars.CLIENT_NAME }}" \
            --parameters keyVaultName="${{ vars.KEY_VAULT_NAME }}" \
            --parameters appConfigName="${{ vars.APP_CONFIG_NAME }}" \
            --parameters dbAdminPassword="${{ secrets.AZURE_DB_ADMIN_PASSWORD }}" \
            --parameters appUserPassword="${{ secrets.AZURE_APP_USER_PASSWORD }}"

      - name: Create Resources (DB -> Storage -> KeyVault secrets -> App Config)
        if: ${{ needs.prepare.outputs.action == 'create' }}
        shell: bash
        run: |
          az deployment group create \
            --name "${{ vars.DEPLOYMENT_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file bicep/main.bicep \
            --parameters envCode="${{ vars.ENV_CODE }}" \
            --parameters clientName="${{ vars.CLIENT_NAME }}" \
            --parameters keyVaultName="${{ vars.KEY_VAULT_NAME }}" \
            --parameters appConfigName="${{ vars.APP_CONFIG_NAME }}" \
            --parameters dbAdminPassword="${{ secrets.AZURE_DB_ADMIN_PASSWORD }}" \
            --parameters appUserPassword="${{ secrets.AZURE_APP_USER_PASSWORD }}"
